org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Прокси задаётся у себя, а не здесь: адрес машины разработчика в общий файл сборки не кладут.
#
# Gradle системные переменные HTTP_PROXY не читает — ему нужно сказать это своими свойствами.
# Кто сидит за прокси, кладёт их в ~/.gradle/gradle.properties:
#
#   systemProp.http.proxyHost=…
#   systemProp.http.proxyPort=…
#   systemProp.https.proxyHost=…
#   systemProp.https.proxyPort=…
#
# Без этого первая же сборка встанет на скачивании зависимостей.
